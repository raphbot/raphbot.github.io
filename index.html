<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIRA Getränke – Summe</title>
<style>
:root{--bg:#faf8f5;--card:#efebe7;--text:#2b2f31;--muted:#6b6f72;--line:rgba(0,0,0,.12);--field:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2426;--card:#2c3336;--text:#eee9e4;--muted:#a0a6a9;--line:rgba(255,255,255,.15);--field:#1f2426;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f2426;--card:#2c3336;--text:#eee9e4;--muted:#a0a6a9;--line:rgba(255,255,255,.15);--field:#1f2426;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:28px 16px 260px}
h1{text-align:center;font-family:Georgia,serif;font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:1.8rem;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
section{background:var(--card);padding:14px 16px;border-radius:4px}
h2{font-family:Georgia,serif;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:1rem;margin:0 0 8px}
.head,.row{display:grid;grid-template-columns:1fr 78px 64px;gap:8px;align-items:center}
.head{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-bottom:4px}
.head span:nth-child(n+2){text-align:center}
.row{padding:6px 0;border-top:1px solid var(--line);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date]{width:100%;box-sizing:border-box;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--field);color:var(--text);font:inherit;font-size:16px;min-height:36px;text-align:right;text-transform:none;letter-spacing:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.logo{height:56px;background:#fff;border-radius:4px;padding:4px}
.dates{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.dates label{display:flex;gap:8px;align-items:center;font-size:.85rem}
.dates input{width:160px;text-align:left}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;font-size:1.3rem}
.sumline{display:flex;gap:16px}
button{font:inherit;font-size:1rem;min-height:44px;touch-action:manipulation;padding:9px 22px;border:0;border-radius:4px;background:#3a4144;color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#result{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:1rem;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;padding:9px 18px;border-radius:4px;background:#3a4144;color:#fff;text-decoration:none}
#msg{text-align:center;font-size:.8rem;color:var(--muted);min-height:1em}
footer b{font-weight:700}
</style>
</head>

function calc(){
  let sum=0;

    const q=parseFloat(o.qty.value)||0;
    sum+=p*q;
  });

}

/* Minimaler PDF-Generator (ohne externe Bibliothek) */
class MiniPDF{
  constructor(){
    this.W=[];this.pages=[[]];this.font='F1';this.size=10;this.img=null;
    const mk=(a)=>{const w={};for(let i=0;i<a.length;i++)w[32+i]=a[i];return w;};
    this.W.F1=mk([278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584]);
    this.W.F2=mk([278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584]);
  }
  setFont(n,s){this.font=(s==='bold')?'F2':'F1';}
  setFontSize(s){this.size=s;}
  addPage(){this.pages.push([]);}
  get cur(){return this.pages[this.pages.length-1];}
  mm(v){return (v*72/25.4).toFixed(2);}
  enc(t){
    let h='';
    for(const ch of String(t)){
      let c=ch.charCodeAt(0);
      if(ch==='€')c=0x80;else if(ch==='–')c=0x96;else if(ch==='—')c=0x97;else if(c>255)c=63;
      h+=(c<16?'0':'')+c.toString(16);
    }
    return '<'+h+'>';
  }
  width(t){
    const w=this.W[this.font];let s=0;
    for(const ch of String(t)){const c=ch.charCodeAt(0);s+=(w[c]||(ch==='€'?556:556));}
    return s*this.size/1000*25.4/72; // mm
  }
  text(t,x,y,o){
    if(o&&o.align==='right')x-=this.width(t);
    this.cur.push('BT /'+this.font+' '+this.size+' Tf '+this.mm(x)+' '+((297-y)*72/25.4).toFixed(2)+' Td '+this.enc(t)+' Tj ET');
  }
  line(x1,y1,x2,y2){
    this.cur.push('0.57 w '+this.mm(x1)+' '+((297-y1)*72/25.4).toFixed(2)+' m '+this.mm(x2)+' '+((297-y2)*72/25.4).toFixed(2)+' l S');
  }
  addImage(dataUrl,type,x,y,w,h){
    const b64=dataUrl.split(',')[1];const bin=atob(b64);const b=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
    let i=2,pw=0,ph=0,nc=3;
    while(i<b.length){
      if(b[i]!==0xFF){i++;continue;}
      const m=b[i+1];
      if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){ph=(b[i+5]<<8)|b[i+6];pw=(b[i+7]<<8)|b[i+8];nc=b[i+9];break;}
      i+=2+((b[i+2]<<8)|b[i+3]);
    }
    if(!pw)throw new Error('Logo ungültig');
    this.img={bytes:b,w:pw,h:ph,cs:nc===1?'/DeviceGray':(nc===4?'/DeviceCMYK':'/DeviceRGB'),page:this.pages.length-1};
    this.cur.push('q '+this.mm(w)+' 0 0 '+this.mm(h)+' '+this.mm(x)+' '+((297-y-h)*72/25.4).toFixed(2)+' cm /Im1 Do Q');
  }
  output(){
    const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
    const push=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length;};
    const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n');push(body);push('\nendobj\n');};
    const np=this.pages.length;
    // Objekte: 1 Catalog, 2 Pages, 3 F1, 4 F2, 5 Bild, 6+ Seiten/Inhalt
    push('%PDF-1.4\n');
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    const kids=[];for(let p=0;p<np;p++)kids.push((6+p*2)+' 0 R');
    obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+np+' >>');
    obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    if(this.img){
      const im=this.img;offs[5]=len;
      push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace '+im.cs+' /BitsPerComponent 8 /Filter /DCTDecode '+(im.cs==='/DeviceCMYK'?'/Decode [1 0 1 0 1 0 1 0] ':'')+'/Length '+im.bytes.length+' >>\nstream\n');
      push(im.bytes);push('\nendstream\nendobj\n');
    }else obj(5,'null');
    for(let p=0;p<np;p++){
      const c=this.pages[p].join('\n');const cl=enc.encode(c).length;
      const pn=6+p*2,cn=pn+1;
      const xo=(this.img&&this.img.page===p)?' /XObject << /Im1 5 0 R >>':'';
      obj(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+xo+' >> /Contents '+cn+' 0 R >>');
      obj(cn,'<< /Length '+cl+' >>\nstream\n'+c+'\nendstream');
    }
    const total=6+np*2;const xr=len;
    let x='xref\n0 '+total+'\n0000000000 65535 f \n';
    for(let n=1;n<total;n++)x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
    push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
    return new Blob(parts,{type:'application/pdf'});
  }
}
const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const msg=t=>document.getElementById('msg').textContent=t;
let downloads=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}catch(e){}

let lastUrl=null;
function showResult(blob,fname){
  if(lastUrl)URL.revokeObjectURL(lastUrl);
  lastUrl=URL.createObjectURL(blob);
  const box=document.getElementById('result');box.textContent='';
  const mk=(t)=>{const a=document.createElement('a');a.className='btn';a.textContent=t;return a;};
  const open=mk('PDF öffnen');open.href=lastUrl;open.target='_blank';open.rel='noopener';
  box.appendChild(open);
  if(navigator.share){
    const sb=document.createElement('button');sb.type='button';sb.textContent='Teilen / Sichern';
    sb.addEventListener('click',async()=>{
      try{
        const file=new File([blob],fname,{type:'application/pdf'});
        if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Rechnung Getränke'});
        else msg('Teilen wird hier nicht unterstützt – bitte „PDF öffnen“ verwenden.');
      }catch(e){if(!(e&&e.name==='AbortError'))msg('Teilen fehlgeschlagen: '+(e&&e.message?e.message:e));}
    });
    box.appendChild(sb);
  }
  const dl=mk('Herunterladen');dl.href=lastUrl;dl.download=fname;box.appendChild(dl);
  msg('PDF ist fertig. Bitte unten auf „PDF öffnen“ oder „Teilen / Sichern“ tippen.');
}
document.getElementById('pdfBtn').addEventListener('click',async()=>{
  const sel=rows.filter(o=>(parseFloat(o.qty.value)||0)>0).map(o=>({o,name:o.name}));
  if(!sel.length){msg('Bitte bei mindestens einer Position eine Anzahl eingeben.');return;}
  try{
  const doc=new MiniPDF();
  const L=20,R=190;let y=40,total=0;
  const dd=v=>v?v.split('-').reverse().join('.'):'';
  try{doc.addImage(document.getElementById('logo').src,'JPEG',L,12,42,42/3.535);}catch(e){}
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  const l1=dd(document.getElementById('lief').value),l2=dd(document.getElementById('rech').value);
  if(l1)doc.text('Lieferdatum: '+l1,R,16,{align:'right'});
  if(l2)doc.text('Rechnungsdatum: '+l2,R,22,{align:'right'});
  const nr=document.getElementById('nr').value.trim();
  if(nr)doc.text('Rechnungsnummer: '+nr,R,28,{align:'right'});
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('Rechnung Getränke',L,y);
  y+=12;
  const head=()=>{doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Position',L,y);doc.text('Preis (EUR)',135,y,{align:'right'});doc.text('Menge',R,y,{align:'right'});y+=2;doc.line(L,y,R,y);y+=6;doc.setFont('helvetica','normal');};
  head();
  sel.forEach(({o,name})=>{
    const p=parseFloat(o.price.value.replace(',','.'))||0,q=parseFloat(o.qty.value)||0;
    total+=p*q;
    if(y>270){doc.addPage();y=24;head();}
    doc.text(name,L,y);doc.text(fmt(p),135,y,{align:'right'});doc.text(String(q),R,y,{align:'right'});y+=7;
  });
  if(y>262){doc.addPage();y=24;}
  y+=2;doc.line(L,y,R,y);y+=8;
  doc.setFont('helvetica','bold');doc.setFontSize(13);
  doc.text('Summe',L,y);doc.text(fmt(total)+' EUR',R,y,{align:'right'});
  const blob=doc.output('blob');
  const fname='mira-getraenke.pdf';
  if(downloads){
    try{await downloads.save({filename:fname,data:blob});msg('PDF wurde gespeichert.');return;}
    catch(e){if(e&&e.code==='declined'){msg('Speichern abgebrochen.');return;}}
  }
  showResult(blob,fname);
  }catch(e){console.error(e);msg(e&&e.code==='declined'?'Speichern abgebrochen.':'PDF konnte nicht erstellt werden: '+(e&&e.message?e.message:e));}
});
</script>
